apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: category-one-page-dev-migrate-job
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/vpc-access-connector: projects/ul-cd-d-931156-cs-prj/locations/us-central1/connectors/d-931156-one-pager
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      taskCount: 1
      cloudSqlInstances: ul-cd-d-931156-cs-prj:us-central1:gfr-cd-d-931156-one-pager-sql
      template:
        spec:
          containers:
            - image: gcr.io/ul-cd-d-931156-cs-prj/category-one-page-unilever-backend/category-one-page:dev
              command: ["bash", "-c", "alembic upgrade head && python app/seed.py"]
              env:
                - name: APP_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: appuser-dev
                      key: latest
          serviceAccountName: gfr-cd-one-pager-devops-sa@ul-cd-d-931156-cs-prj.iam.gserviceaccount.com
          maxRetries: 1
          timeoutSeconds: 600
